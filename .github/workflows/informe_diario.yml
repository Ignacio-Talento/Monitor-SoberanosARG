# Datos duros de la rueda para el informe diario que sale por mail a las 20:00.
#
# POR QUÉ CORRE ACÁ Y NO EN LA MÁQUINA. La API key de 1816 vive sólo como Secret de este repo. El
# proxy de producción tampoco sirve de atajo: está detrás de Cloudflare Access y devuelve 302 al
# login sin sesión de navegador. Así que el único lugar donde se pueden pedir las TIRs sin poner la
# key en un disco es acá.
#
# ESTE JOB NO MANDA EL MAIL. Deja el JSON commiteado; la tarea programada de las 17:30 lo baja,
# escribe el análisis y manda el correo. La separación es la que hace que el informe sea auditable:
# los números quedan versionados junto al commit que los produjo, y se puede releer cualquier rueda
# pasada sin volver a gastar créditos.
name: Datos del Informe Diario

on:
  schedule:
    # 18:10 hora Argentina (UTC-3) = 21:10 UTC, lunes a viernes.
    #
    # ESTE CRON ES EL RESPALDO, NO EL CAMINO PRINCIPAL. El mail sale a las 17:30 y la tarea que lo
    # escribe dispara este workflow ella misma con `gh workflow run`, que arranca en segundos. No se
    # puede depender del schedule para eso: GitHub demora los crones entre 20 y 50 minutos de rutina
    # y a veces no los ejecuta —el 26/08/2026 no corrió ninguno de los dos del job de precios—, así
    # que un cron a las 17:10 llegaría tarde al mail de las 17:30 la mitad de las veces.
    #
    # Para qué sirve entonces: para que la rueda quede archivada aunque la máquina del usuario esté
    # apagada a las 17:30 y la tarea no llegue a correr. Es barato —el script vuelve a pedir los
    # mismos datos, unos 1.500 créditos— y garantiza que el histórico no tenga huecos.
    #
    # A las 18:10 el mercado hace más de una hora que cerró y 1816 tiene la rueda completa.
    - cron: '10 21 * * 1-5'
    # SEGUNDO INTENTO, 19:40 ART. No es redundancia: un cron de este repo directamente NO EJECUTA
    # cada tanto, y con uno solo eso deja la rueda sin archivar. Pasó el 03/09/2026 —no disparó
    # ninguno de los tres workflows del día— y el 04/09, cuando este cron no corrió y la rueda se
    # archivó recién a mano. El job de precios ya usa este mismo patrón de dos horarios y esa vez
    # funcionó: falló el primero y entró el segundo, con una hora de atraso.
    #
    # Vuelve a pedir los mismos datos y reescribe el mismo archivo, así que correr dos veces no
    # rompe nada: cuesta ~1.500 créditos sobre 100.000 diarios y el paso de commit no hace nada si
    # el contenido no cambió.
    - cron: '40 22 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  informe:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # matplotlib y adjustText son para las curvas. Open Sans NO se instala: va versionada en
      # assets/fonts/ y curvas_informe.py la registra sola, justamente para que el runner dibuje
      # con la misma tipografía que la máquina del usuario.
      - name: Instalar dependencias
        run: pip install requests openpyxl matplotlib adjustText

      # El script se planta solo si el día no es hábil (feriado que Actions igual dispara) y sale
      # sin escribir nada.
      # ANTES de armar el informe, no después: armar_informe.py LEE series_mercado.json para el
      # margen sobre TAMAR de los duales y el forward de los Bonares. Si corriera después, el
      # informe del día saldría con el cierre de ayer en esas dos tablas.
      # continue-on-error porque el informe tiene que salir igual sin ellas: el script deja el
      # archivo anterior y armar_informe.py avisa en el PDF que el dato no es del día.
      - name: Series de mercado (Duales y Bonares)
        continue-on-error: true
        env:
          API_1816_KEY: ${{ secrets.API_1816_KEY }}
        run: python series_mercado.py

      - name: Extraer datos de la rueda
        env:
          API_1816_KEY: ${{ secrets.API_1816_KEY }}
        run: python armar_informe.py

      # Segunda vía para las series macro de la solapa Macro. Su workflow propio ("Series Macro")
      # corre dos veces por día por cron, pero los crones de este repo llegan tarde o no disparan;
      # este job, en cambio, lo lanza la tarea de las 17:30 con `gh workflow run`, así que sí corre.
      # Va con continue-on-error porque el informe del día no depende de esto: si el BCRA está
      # caído, la rueda se archiva igual.
      # Las curvas de la rueda, publicadas en informes/curvas/AAAA-MM-DD/ con su índice.
      #
      # POR QUÉ ACÁ Y NO SÓLO EN LA MÁQUINA DEL USUARIO. El informe lo arma una tarea programada que
      # sólo corre con la app abierta; si está apagada a las 17:30 no sale el informe y hasta ahora
      # tampoco quedaban las curvas, así que el link del archivo histórico de esa rueda daba 404
      # para siempre. El dato se archivaba pero los gráficos no. Ahora sí.
      #
      # NO PISA EL PDF: la página índice lista los cierre-*.pdf que encuentre, y el PDF lo agrega
      # después la máquina del usuario porque necesita la prosa del día. El orden no importa.
      #
      # continue-on-error porque las curvas son el extra: si matplotlib falla, el dato de la rueda
      # —que es lo que no se puede recuperar después— ya quedó guardado en el paso anterior.
      - name: Publicar las curvas de la rueda
        continue-on-error: true
        run: python publicar_curvas.py

      - name: Refrescar series macro
        continue-on-error: true
        run: python macro_series.py

      - name: Commit y push si hay cambios
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add informes/ macro_series.json series_mercado.json
          git diff --staged --quiet || git commit -m "Datos del informe $(date +'%Y-%m-%d')"
          git push
