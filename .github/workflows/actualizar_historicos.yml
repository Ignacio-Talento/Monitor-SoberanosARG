name: Actualizar Históricos de Precios
 
on:
  schedule:
    # 17:20 hora Argentina (UTC-3) = 20:20 UTC. Solo días de semana.
    #
    # NO son las 17:05 a propósito. El repo del colega corre su propio job con ese cron y con la
    # MISMA API key de 1816, cuyo limitador es global: los dos arrancaban juntos y el que llegaba
    # segundo se comía un 429. Cuando eso pasaba, la corrida caía a Eco Valores, que no publica
    # subsoberanos ni ONs, y la rueda quedaba con ~70 tickers en vez de ~165 (pasó el 12 y el 14
    # de agosto de 2026). Quince minutos alcanzan de sobra: ese job tarda uno o dos.
    - cron: '20 20 * * 1-5'
    # Respaldo, 18:20 ART = 21:20 UTC. GitHub no garantiza los schedules: los demora entre 20 y 50
    # minutos de rutina y a veces directamente los saltea. El 26/08/2026 no ejecutó ninguno, y la
    # rueda de ese día se habría perdido sin que nada avisara —el workflow no falla, simplemente no
    # existe la corrida—.
    #
    # Es barato porque el script es idempotente: si la fila del día ya está escrita sale por "ya
    # existe fila" ANTES de pedirle precios a 1816, así que no gasta créditos. El segundo paso, el
    # de las series de Glob vs Bon, sí vuelve a correr, pero es incremental: pide sólo los días que
    # le falten, que en la segunda pasada del mismo día son un puñado.
    - cron: '20 21 * * 1-5'
  workflow_dispatch: # Permite ejecución manual desde GitHub

permissions:
  contents: write
 
jobs:
  actualizar:
    runs-on: ubuntu-latest
 
    steps:
      - name: Checkout repositorio
        uses: actions/checkout@v4
 
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
 
      - name: Instalar dependencias
        run: |
          pip install requests openpyxl
 
      - name: Ejecutar script de actualización
        env:
          API_1816_KEY: ${{ secrets.API_1816_KEY }}
        run: python actualizar_historicos.py

      # Respaldo de las series que grafica "Glob vs Bon". Va con continue-on-error a propósito:
      # es un archivo de respaldo, no el dato del día, y si 1816 falla acá no tiene por qué
      # arrastrar al historicos.xlsx que ya se actualizó bien en el paso anterior.
      - name: Completar el respaldo de Glob vs Bon
        continue-on-error: true
        env:
          API_1816_KEY: ${{ secrets.API_1816_KEY }}
        run: python actualizar_series_globvsbon.py

      # Insumos del spread de sintéticos. Completa las ruedas que falten desde el CEM de A3
      # Mercados (precio de ajuste) más las tasas de 1816, así que se pone al día solo si alguna
      # corrida se saltea. Va con continue-on-error como el paso de Glob vs Bon: un hueco en un
      # gráfico no es razón para marcar en rojo una corrida que sí guardó los precios del día.
      #
      # El ajuste se publica después del clearing, de modo que este paso agrega la rueda de AYER.
      - name: Acumular insumos del spread de sintéticos
        continue-on-error: true
        env:
          API_1816_KEY: ${{ secrets.API_1816_KEY }}
        run: python actualizar_spreads.py

      - name: Commit y push si hay cambios
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add historicos.xlsx series_globvsbon.xlsx spreads_sinteticos.json
          git diff --staged --quiet || git commit -m "Actualizar historicos $(date +'%Y-%m-%d')"
          git push
