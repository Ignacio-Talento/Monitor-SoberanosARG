# Relleno de ruedas incompletas. NO tiene schedule a propósito: se dispara a mano cuando una
# corrida diaria se comió un 429 y dejó la rueda con ~70 tickers en vez de ~165. Gasta créditos
# de 1816 (uno por ticker por día), así que conviene correrlo primero con dry_run.
name: Completar Ruedas Incompletas

on:
  workflow_dispatch:
    inputs:
      fechas:
        description: 'Fechas AAAA-MM-DD separadas por espacio (vacío = detectar solo)'
        required: false
        default: ''
      dry_run:
        description: 'Sólo listar qué haría y cuánto costaría'
        type: boolean
        default: true
      probe:
        description: 'Diagnóstico: tickers separados por coma para consultar a /series y ver qué devuelve. Si se completa, no se toca historicos.xlsx.'
        required: false
        default: ''
      campos:
        description: 'Campos del sondeo (default precioDirty). Ej: tea,durationMod'
        required: false
        default: ''
      moneda:
        description: 'Moneda del sondeo: ars, mep o ccl (default mep)'
        required: false
        default: ''
      comparar_ons:
        description: 'Diagnóstico: compara la TIR de cada ON contra 1816 (usá "fechas" para pasar tickers puntuales)'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  completar:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: pip install requests openpyxl

      # Sondeo. Existe porque cuando /series contesta "sin datos" no hay forma de saber desde acá
      # si el problema es el ticker, la moneda o que 1816 directamente no publica histórico de ese
      # instrumento. Los flags son fijos a propósito: el input es texto libre y no tiene por qué
      # poder armar una línea de comando arbitraria dentro del runner.
      - name: Sondear /series
        if: ${{ inputs.probe != '' }}
        env:
          API_1816_KEY: ${{ secrets.API_1816_KEY }}
          PROBE: ${{ inputs.probe }}
          CAMPOS: ${{ inputs.campos }}
          MONEDA: ${{ inputs.moneda }}
          # El input `fechas` se reusa acá como "desde hasta". Con un solo ticker líquido esto
          # devuelve el calendario de ruedas reales: las fechas que faltan son feriados.
          RANGO: ${{ inputs.fechas }}
        run: |
          set -- ${RANGO:-2026-07-06 2026-07-15}
          python precios_1816.py --serie --tickers "$PROBE" --campos "${CAMPOS:-precioDirty}" \
            --moneda "${MONEDA:-mep}" --desde "$1" --hasta "${2:-$1}"

      # Diagnóstico de tasas: compara la TIR que calcula el monitor con la que publica 1816, ON
      # por ON. Reintenta ante 429 por lote, así un rate limit no tumba la corrida entera como
      # pasa con la CLI cruda del sondeo.
      - name: Comparar tasas de ONs contra 1816
        if: ${{ inputs.comparar_ons }}
        env:
          API_1816_KEY: ${{ secrets.API_1816_KEY }}
          TICKERS: ${{ inputs.fechas }}
        run: python comparar_ons_1816.py $TICKERS

      - name: Completar ruedas
        if: ${{ inputs.probe == '' && !inputs.comparar_ons }}
        env:
          API_1816_KEY: ${{ secrets.API_1816_KEY }}
          # Por variable de entorno y no interpolado en el `run`: lo que se escriba en el input
          # llegaría al shell tal cual, y un input es texto libre.
          FECHAS: ${{ inputs.fechas }}
          DRY: ${{ inputs.dry_run }}
        run: |
          [ "$DRY" = "true" ] && FLAG=--dry-run || FLAG=
          python completar_ruedas.py $FLAG $FECHAS

      - name: Commit y push si hay cambios
        if: ${{ !inputs.dry_run }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add historicos.xlsx
          git diff --staged --quiet || git commit -m "Completar ruedas incompletas $(date +'%Y-%m-%d')"
          git push
